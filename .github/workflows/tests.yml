name: Tests

on:
  push:
    branches:
      - main
      - feat/task-time-tracking
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-time
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-time/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.mjs
